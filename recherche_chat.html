<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo_arche.png">
<title>Recherche animal — L'Arche de Mallo</title>
<style>
  :root{ --cream:#faf7f2; --warm:#f0e8d8; --brown:#3d2b1f; --orange:#c96b2a; --grey:#8a7968; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--brown);}
  header{background:#fff;border-bottom:3px solid var(--orange);padding:18px 24px;display:flex;align-items:center;gap:14px;}
  header h1{font-size:16px;margin:0;}
  header p{font-size:11px;color:var(--grey);margin:2px 0 0;}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  .search-box{position:relative;margin-bottom:20px;}
  .search-box input{width:100%;box-sizing:border-box;padding:12px 14px;font-size:14px;border:1px solid var(--warm);border-radius:10px;background:#fff;}
  .selecteur-animal-dropdown div{font-size:13px;}
  .card{background:#fff;border:1px solid var(--warm);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--orange);display:flex;align-items:center;gap:6px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12.5px;}
  .grid2 .lbl{color:var(--grey);}
  .empty{color:var(--grey);font-size:12px;font-style:italic;}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
  th{text-align:left;font-size:10px;color:var(--grey);text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--warm);}
  td{padding:5px 6px;border-bottom:1px solid #f2ece1;}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--warm);font-size:10px;}
  .lien-pdf{color:var(--orange);text-decoration:none;font-size:11px;white-space:nowrap;}
  .lien-pdf:hover{text-decoration:underline;}
  .filtres{display:flex;gap:10px;margin-bottom:10px;}
  .filtres select{padding:12px 10px;font-size:14px;border:1px solid var(--warm);border-radius:10px;background:#fff;color:var(--brown);}
  .filtres input{flex:1;min-width:0;}
  .liste-animaux{background:#fff;border:1px solid var(--warm);border-radius:10px;max-height:300px;overflow-y:auto;margin-bottom:20px;}
  .liste-animaux .ligne{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #f2ece1;cursor:pointer;font-size:13px;}
  .liste-animaux .ligne:hover{background:#faf3e8;}
  .liste-animaux .ligne.choisi{background:#f6e7d4;}
  .liste-animaux .num{color:var(--grey);font-size:11px;min-width:64px;}
  .liste-animaux .meta{margin-left:auto;color:var(--grey);font-size:11px;text-align:right;}
  .compteur{font-size:11px;color:var(--grey);margin:-4px 0 8px;}
  .pers{line-height:1.5;}
  .pers small{color:var(--grey);}
  #login-err{color:#c00000;font-size:12px;margin-bottom:10px;min-height:16px;}
</style>
</head>
<body>

<div id="login-screen" style="position:fixed;inset:0;background:var(--cream);z-index:99999;display:flex;align-items:center;justify-content:center;">
  <div style="max-width:340px;width:90%;background:#fff;border:1px solid var(--warm);border-radius:10px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
    <h1 style="font-size:16px;margin:0 0 4px;">L'Arche de Mallo</h1>
    <p style="font-size:12px;color:var(--grey);margin-bottom:16px;">Connexion requise.</p>
    <input type="email" id="login-email" placeholder="Email" style="width:100%;box-sizing:border-box;margin-bottom:10px;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;">
    <input type="password" id="login-password" placeholder="Mot de passe" style="width:100%;box-sizing:border-box;margin-bottom:10px;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;">
    <div id="login-err"></div>
    <button type="button" onclick="seConnecterSuivi()" style="width:100%;padding:9px;background:var(--orange);color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:13px;">Se connecter</button>
  </div>
</div>

<header>
  <div>
    <h1>Recherche animal</h1>
    <p>Retrouvez la fiche complète d'un chat déjà connu de l'association</p>
  </div>
</header>
<div class="wrap">
  <div class="filtres">
    <select id="filtre-annee" title="Année d'arrivée à l'Arche"></select>
    <input type="text" id="recherche-input" placeholder="Nom, n° interne ou puce (laisser vide pour tout voir)…" style="padding:12px 14px;font-size:14px;border:1px solid var(--warm);border-radius:10px;">
  </div>
  <div class="compteur" id="compteur"></div>
  <div class="liste-animaux" id="liste-animaux"></div>
  <div id="resultat"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script src="supabase-config.js"></script>
<script src="formulaires-arche-mallo.js"></script>
<script>
const supabaseClient = creerClientSupabase();
initSessionSuivi();

let animalChoisiId = null;
let timerRecherche = null;

const LIB_ORIGINE = { trappage:'Trappage', depot:'Dépôt', abandon:'Abandon', saisie:'Saisie', ne_a_association:"Né à l'association", transfert_autre_association:"Transfert d'une autre association" };
const LIB_STATUT = { arrive:'Arrivé', en_observation:'En observation', au_veto:'Au vétérinaire', adoptable:'Adoptable', non_adoptable:'Non adoptable', reserve:'Réservé', adopte:'Adopté', famille_accueil:"En famille d'accueil", decede:'Décédé', relache:'Relâché', retour:'Retour', transfere:'Transféré', malade:'Malade', reservation_annulee:'Réservation annulée' };
function libOrigine(o) { return o ? (LIB_ORIGINE[o] || o) : '—'; }
function libStatut(s) { return s ? (LIB_STATUT[s] || s) : '—'; }

document.addEventListener('DOMContentLoaded', async function() {
  document.getElementById('filtre-annee').addEventListener('change', lancerRecherche);
  document.getElementById('recherche-input').addEventListener('input', function() {
    clearTimeout(timerRecherche);
    timerRecherche = setTimeout(lancerRecherche, 250);
  });
  await chargerAnnees();
  lancerRecherche();
});

// Remplit la liste des années (année d'arrivée à l'Arche) ; année en cours par défaut
async function chargerAnnees() {
  const sel = document.getElementById('filtre-annee');
  const { data, error } = await supabaseClient.rpc('annees_arrivee_animaux');
  if (error) { sel.innerHTML = '<option value="">Toutes les années</option>'; console.error(error.message); return; }
  const anneeCourante = new Date().getFullYear();
  const annees = data || [];
  let html = '<option value="">Toutes les années</option>';
  annees.forEach(a => {
    html += `<option value="${a.annee}">${a.annee === 0 ? 'Année inconnue' : a.annee} (${a.nb})</option>`;
  });
  sel.innerHTML = html;
  const parDefaut = annees.find(a => a.annee === anneeCourante) || annees.find(a => a.annee > 0);
  if (parDefaut) sel.value = String(parDefaut.annee);
}

async function lancerRecherche() {
  const liste = document.getElementById('liste-animaux');
  const compteur = document.getElementById('compteur');
  const annee = document.getElementById('filtre-annee').value;
  const texte = document.getElementById('recherche-input').value;
  liste.innerHTML = '<div class="empty" style="padding:10px 12px;">Chargement…</div>';
  const { data, error } = await supabaseClient.rpc('rechercher_animaux_fiche', {
    p_recherche: texte,
    p_annee: annee === '' ? null : parseInt(annee, 10)
  });
  if (error) { liste.innerHTML = `<div class="empty" style="padding:10px 12px;">Erreur : ${escH(error.message)}</div>`; compteur.textContent = ''; return; }
  const animaux = data || [];
  compteur.textContent = animaux.length + (animaux.length > 1 ? ' animaux' : ' animal');
  if (!animaux.length) {
    liste.innerHTML = '<div class="empty" style="padding:10px 12px;">Aucun animal trouvé' + (annee !== '' ? ' pour cette année — essayez « Toutes les années ».' : '.') + '</div>';
    return;
  }
  liste.innerHTML = animaux.map(a => `<div class="ligne${a.id === animalChoisiId ? ' choisi' : ''}" data-id="${escH(a.id)}">
      <span class="num">${escH(a.numero_interne || '')}</span>
      <strong>${escH(a.nom_usuel)}</strong>${a.couleur ? ' <span style="color:var(--grey);">— ' + escH(a.couleur) + '</span>' : ''}
      <span class="meta"><span class="badge">${escH(libStatut(a.statut_actuel))}</span><br>${a.date_arrivee ? 'arrivé le ' + fmtDate(a.date_arrivee) : 'arrivée inconnue'}${a.origine_arrivee ? ' · ' + escH(libOrigine(a.origine_arrivee)) : ''}</span>
    </div>`).join('');
  liste.querySelectorAll('.ligne').forEach(l => l.addEventListener('click', function() {
    animalChoisiId = l.getAttribute('data-id');
    liste.querySelectorAll('.ligne').forEach(x => x.classList.toggle('choisi', x === l));
    chargerFiche(animalChoisiId);
  }));
}

// Chrome bloque l'ouverture directe des URL "data:" : on les convertit en Blob avant ouverture
document.addEventListener('click', function (e) {
  const a = e.target.closest && e.target.closest('a[href^="data:"]');
  if (!a) return;
  e.preventDefault();
  try {
    const href = a.getAttribute('href');
    const i = href.indexOf(',');
    const mime = (href.slice(5, i).split(';')[0]) || 'application/octet-stream';
    const bin = atob(href.slice(i + 1));
    const arr = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
    const url = URL.createObjectURL(new Blob([arr], { type: mime }));
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (err) { alert("Impossible d'ouvrir ce fichier : " + err.message); }
});
function escH(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }
function fmtDate(d) { if (!d) return '—'; const s=String(d).trim(); if (/^\d{4}-\d{2}-\d{2}/.test(s)) { const p=s.slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; } return s; }
function nomPersonne(p) {
  if (!p) return '—';
  if (p.type_personne === 'entreprise') return p.raison_sociale || '—';
  return `${p.prenom||''} ${p.nom||''}`.trim() || '—';
}
function liensPdf(fichiers) {
  if (!fichiers || !fichiers.length) return '<span class="empty">Aucun document</span>';
  return fichiers.map((f,i) => `<a class="lien-pdf" href="${escH(f.url)}" target="_blank">📄 ${escH(f.type_fichier||('Document '+(i+1)))}</a>`).join(' · ');
}
function viderResultat() { document.getElementById('resultat').innerHTML = ''; }


function infosPersonne(p) {
  if (!p) return '<span class="empty">—</span>';
  const det = [p.telephone, p.email, [p.adresse, p.code_postal, p.ville].filter(Boolean).join(' ')].filter(Boolean).map(escH).join(' · ');
  return `<div class="pers"><strong>${escH(nomPersonne(p))}</strong>${det ? '<br><small>' + det + '</small>' : ''}</div>`;
}
function dateTri(d) { return d ? String(d).slice(0, 10) : ''; }

// Chronologie unifiée : tout ce qui concerne l'animal, du plus récent au plus ancien
function construireChronologie(d) {
  const a = d.animal, ev = [];
  const docsArr = d.documents_arrivee || [];
  const motifArrivee = (d.statuts || []).slice().sort((x, y) => dateTri(x.date_debut).localeCompare(dateTri(y.date_debut)))[0];
  ev.push({ date: a.date_arrivee, titre: 'Arrivée — ' + escH(libOrigine(a.origine_arrivee)),
    pers: d.personne_origine, detail: motifArrivee && motifArrivee.motif ? escH(motifArrivee.motif) : '', docs: docsArr });
  (d.statuts || []).forEach(h => ev.push({ date: h.date_debut, titre: 'Statut → ' + escH(libStatut(h.statut)), pers: null, detail: escH(h.motif || ''), docs: [] }));
  (d.soins || []).forEach(sv => ev.push({ date: sv.date_soin, titre: 'Soin : ' + escH(sv.type_soin || '—'), pers: null, detail: escH([sv.veterinaire, sv.description].filter(Boolean).join(' — ')), docs: [] }));
  if (d.sterilisation && d.sterilisation.sterilise) ev.push({ date: d.sterilisation.date_sterilisation, titre: 'Stérilisation', pers: null, detail: '', docs: d.sterilisation.fichier_sterilisation_url ? [{ url: d.sterilisation.fichier_sterilisation_url, type_fichier: 'Certificat de stérilisation' }] : [] });
  if (d.icad) {
    if (d.icad.date_transfert || d.icad.fichier_icad_url) ev.push({ date: d.icad.date_transfert, titre: 'Transfert ICAD', pers: null, detail: escH(d.icad.commentaire || ''), docs: d.icad.fichier_icad_url ? [{ url: d.icad.fichier_icad_url, type_fichier: 'Fichier ICAD' }] : [] });
  }
  (d.adoptions || []).forEach(r => ev.push({ date: r.date_adoption, titre: 'Adoption', pers: r.personne, detail: r.total_participation ? 'Participation : ' + r.total_participation + ' €' : '', docs: r.fichiers }));
  (d.reservations || []).forEach(r => ev.push({ date: r.date_reservation, titre: 'Réservation' + (r.type_reservation ? ' (' + escH(r.type_reservation) + ')' : ''), pers: r.personne, detail: '', docs: r.fichiers }));
  (d.depots || []).forEach(r => ev.push({ date: r.date_depot, titre: 'Dépôt (formulaire)', pers: r.personne, detail: escH(r.commune || ''), docs: r.fichiers }));
  (d.abandons || []).forEach(r => ev.push({ date: r.date_fait, titre: 'Abandon (formulaire)', pers: r.personne, detail: escH(r.cause_abandon || ''), docs: r.fichiers }));
  (d.familles_accueil || []).forEach(r => ev.push({ date: r.date_debut || r.date_fait, titre: "Famille d'accueil (" + escH(r.type_accueil || '—') + ')', pers: r.personne, detail: r.date_fin ? "jusqu'au " + fmtDate(r.date_fin) : 'en cours', docs: r.fichiers }));
  (d.attestations || []).forEach(r => ev.push({ date: r.date_fait, titre: 'Attestation : ' + ({ cbs_absent: 'CBS absent', decharge_vaccin: 'Décharge vaccin' }[r.type_attestation] || escH(r.type_attestation || '—')), pers: r.personne, detail: escH(r.motif || ''), docs: r.fichiers }));
  if (a.date_deces) ev.push({ date: a.date_deces, titre: 'Décès', pers: null, detail: '', docs: [] });
  ev.sort((x, y) => dateTri(y.date).localeCompare(dateTri(x.date)));
  return ev;
}

async function chargerFiche(animalId) {
  document.getElementById('resultat').innerHTML = '<div class="empty">Chargement…</div>';
  const { data, error } = await supabaseClient.rpc('obtenir_fiche_animal', { p_animal_id: animalId });
  if (error) { document.getElementById('resultat').innerHTML = `<div class="empty">Erreur : ${escH(error.message)}</div>`; return; }
  if (!data) { document.getElementById('resultat').innerHTML = '<div class="empty">Animal introuvable.</div>'; return; }
  render(data);
}

function render(d) {
  const a = d.animal, s = d.sterilisation;
  let html = '';

  const photos = d.photos || [];
  const libSource = { arrivee:"à l'arrivée", reservation:'à la réservation', famille_accueil:"en famille d'accueil" };
  const photoHtml = photos.length
    ? `<div style="margin-bottom:12px;"><a href="${escH(photos[0].url)}" target="_blank"><img src="${escH(photos[0].url)}" alt="Photo de ${escH(a.nom_usuel)}" style="max-width:260px;max-height:200px;border:1px solid #ddd;border-radius:8px;display:block;"></a>
        <div class="lbl" style="margin-top:4px;">Photo ${libSource[photos[0].source]||''} ${photos[0].cree_le?'('+fmtDate(photos[0].cree_le)+')':''}</div>
        ${photos.length>1 ? `<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">${photos.slice(1).map(ph=>`<a href="${escH(ph.url)}" target="_blank" title="${escH(libSource[ph.source]||'')} ${ph.cree_le?fmtDate(ph.cree_le):''}"><img src="${escH(ph.url)}" style="height:56px;border:1px solid #ddd;border-radius:4px;"></a>`).join('')}</div>` : ''}</div>`
    : '<div class="empty" style="margin-bottom:8px;">Aucune photo enregistrée</div>';

  html += `<div class="card"><h2>🐱 ${escH(a.nom_usuel)} ${a.nom_adoption?('— '+escH(a.nom_adoption)):''} <span class="badge">${escH(libStatut(a.statut_actuel))}</span></h2>
    ${photoHtml}
    <div class="grid2">
      <div><span class="lbl">Espèce / race :</span> ${escH(a.espece||'—')}${a.race?' — '+escH(a.race):''}</div>
      <div><span class="lbl">Sexe :</span> ${escH(a.sexe||'—')}</div>
      <div><span class="lbl">Couleur :</span> ${escH(a.couleur||'—')}</div>
      <div><span class="lbl">Maman :</span> ${escH(a.nom_maman||'—')}</div>
      <div><span class="lbl">Naissance :</span> ${fmtDate(a.date_naissance)}${a.date_naissance_estimee?' (estimée)':''}</div>
      <div><span class="lbl">Puce :</span> ${escH(a.puce||'—')}</div>
      <div><span class="lbl">N° carnet de santé :</span> ${escH(a.numero_carnet_sante||'—')}</div>
      <div><span class="lbl">Arrivée :</span> ${fmtDate(a.date_arrivee)}${a.origine_arrivee?' — '+escH(a.origine_arrivee):''}</div>
      <div><span class="lbl">Stérilisé(e) :</span> ${s ? (s.sterilise?'Oui — '+fmtDate(s.date_sterilisation):'Non') : '—'}</div>
      ${a.noms_precedents ? `<div style="grid-column:1/-1;"><span class="lbl">Noms précédents :</span> ${escH(a.noms_precedents)}</div>` : ''}
      ${a.signes_particuliers ? `<div style="grid-column:1/-1;"><span class="lbl">Signes particuliers :</span> ${escH(a.signes_particuliers)}</div>` : ''}
      ${a.date_deces ? `<div style="grid-column:1/-1;color:#c00000;"><span class="lbl">Décès :</span> ${fmtDate(a.date_deces)}</div>` : ''}
    </div></div>`;

  const premierStatut = (d.statuts || []).slice().sort((x, y) => dateTri(x.date_debut).localeCompare(dateTri(y.date_debut)))[0];
  html += `<div class="card"><h2>📥 Arrivée à l'Arche</h2>
    <div class="grid2">
      <div><span class="lbl">Origine :</span> <strong>${escH(libOrigine(a.origine_arrivee))}</strong></div>
      <div><span class="lbl">Date d'arrivée :</span> ${fmtDate(a.date_arrivee)}</div>
      <div><span class="lbl">${a.origine_arrivee === 'trappage' ? 'Commune de trappage :' : 'Motif / commune :'}</span> ${escH((premierStatut && premierStatut.motif) || '—')}</div>
      <div><span class="lbl">Formulaire / fiche d'arrivée :</span> ${liensPdf(d.documents_arrivee)}</div>
      <div style="grid-column:1/-1;"><span class="lbl">Personne à l'origine :</span> ${infosPersonne(d.personne_origine)}</div>
    </div></div>`;

  const chrono = construireChronologie(d);
  html += `<div class="card"><h2>🕘 Tous les mouvements</h2><table><thead><tr><th>Date</th><th>Mouvement</th><th>Personne</th><th>Détail</th><th>Documents</th></tr></thead><tbody>
    ${chrono.map(e => `<tr><td style="white-space:nowrap;">${fmtDate(e.date)}</td><td><strong>${e.titre}</strong></td><td>${e.pers ? infosPersonne(e.pers) : '—'}</td><td>${e.detail || '—'}</td><td>${liensPdf(e.docs)}</td></tr>`).join('')}
    </tbody></table></div>`;

  html += `<div class="card"><h2>📋 Historique de statut</h2>${
    d.statuts.length ? `<table><thead><tr><th>Statut</th><th>Du</th><th>Au</th><th>Motif</th></tr></thead><tbody>
      ${d.statuts.map(h=>`<tr><td>${escH(libStatut(h.statut))}</td><td>${fmtDate(h.date_debut)}</td><td>${h.date_fin?fmtDate(h.date_fin):'en cours'}</td><td>${escH(h.motif||'—')}</td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">Aucun historique de statut</div>'}</div>`;

  html += `<div class="card"><h2>💉 Suivi médical</h2>${
    d.soins.length ? `<table><thead><tr><th>Date</th><th>Type</th><th>Détail</th><th>Prochain rappel</th></tr></thead><tbody>
      ${d.soins.map(sv=>`<tr><td>${fmtDate(sv.date_soin)}</td><td>${escH(sv.type_soin)}</td><td>${escH(sv.description||'—')}</td><td>${sv.prochain_rappel?fmtDate(sv.prochain_rappel):'—'}</td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">Aucun soin enregistré</div>'}</div>`;

  const sections = [
    { key:'adoptions',        titre:'🏠 Adoption(s)',        cols:['Date','Personne','Participation','Documents'],
      row:r=>[fmtDate(r.date_adoption), infosPersonne(r.personne), r.total_participation?r.total_participation+' €':'—', liensPdf(r.fichiers)] },
    { key:'reservations',     titre:'📅 Réservation(s)',     cols:['Date','Type','Personne','Documents'],
      row:r=>[fmtDate(r.date_reservation), escH(r.type_reservation||'—'), infosPersonne(r.personne), liensPdf(r.fichiers)] },
    { key:'depots',           titre:'📥 Dépôt(s)',           cols:['Date','Personne','Commune','Documents'],
      row:r=>[fmtDate(r.date_depot), infosPersonne(r.personne), escH(r.commune||'—'), liensPdf(r.fichiers)] },
    { key:'abandons',         titre:'💔 Abandon(s)',         cols:['Date','Personne','Cause','Documents'],
      row:r=>[fmtDate(r.date_fait), infosPersonne(r.personne), escH(r.cause_abandon||'—'), liensPdf(r.fichiers)] },
    { key:'familles_accueil', titre:'🤝 Famille(s) d\'accueil', cols:['Type','Du','Au','Personne','Documents'],
      row:r=>[escH(r.type_accueil||'—'), fmtDate(r.date_debut), r.date_fin?fmtDate(r.date_fin):'en cours', infosPersonne(r.personne), liensPdf(r.fichiers)] },
    { key:'attestations',     titre:'📜 Attestation(s)',     cols:['Date','Type','Personne','Documents'],
      row:r=>[fmtDate(r.date_fait), escH(r.type_attestation||'—'), infosPersonne(r.personne), liensPdf(r.fichiers)] },
  ];
  sections.forEach(sec => {
    const rows = d[sec.key] || [];
    html += `<div class="card"><h2>${sec.titre}</h2>${
      rows.length ? `<table><thead><tr>${sec.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
        ${rows.map(r=>`<tr>${sec.row(r).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
      </tbody></table>` : '<div class="empty">Aucun enregistrement</div>'}</div>`;
  });

  document.getElementById('resultat').innerHTML = html;
}
</script>
</body>
</html>
