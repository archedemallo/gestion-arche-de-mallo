<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi prêt matériel — L'Arche de Mallo</title>
<link rel="icon" type="image/png" href="logo_arche.png">
<link rel="stylesheet" href="entete-site.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
    --cream: #faf7f2; --warm: #f0e8d8; --brown: #3d2b1f;
    --orange: #c96b2a; --orange-light: #e8843a; --grey: #8a7968;
    --white: #ffffff; --green: #2e7d32; --green-light: #e8f5e9;
    --amber: #e65100; --amber-light: #fff3e0;
    --red: #c62828; --red-light: #ffebee;
    --blue: #1565c0; --blue-light: #e3f2fd;
    --shadow: 0 4px 24px rgba(61,43,31,0.10);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--brown); min-height:100vh; }

/* EN-TÊTE ASSOCIATION (même rendu que suivi_icad.html — creerEntete()) */
#entete { font-family:'Calibri',Arial,Helvetica,sans-serif; color:#000; line-height:1.6; }
#entete .header-adoption { display:flex; justify-content:space-between; align-items:center; }
#entete .header-adoption-right { display:none; }
#entete .header-info { flex:1; text-align:center; margin-top:0; line-height:1.8; }
#entete .header-info p { margin:8px 0; font-size:14pt; }
#entete .logo-box { width:240px; height:160px; background-image:url('logo_arche.png'); background-size:contain; background-repeat:no-repeat; background-position:center; margin-bottom:8px; }
#entete .bold { font-weight:bold; }
#entete .blue { color:#0563c1; }
#entete .title { text-align:center; font-size:18pt; font-weight:bold; margin:10px 0 16px; }

.main { max-width:1200px; margin:0 auto; padding:24px 20px; }

/* ONGLETS */
.tabs { display:flex; gap:0; border-bottom:2px solid var(--warm); margin-bottom:20px; overflow-x:auto; }
.tab { padding:10px 20px; font-size:14px; font-weight:500; cursor:pointer; border:none; background:transparent; color:var(--grey); border-bottom:2px solid transparent; margin-bottom:-2px; font-family:'DM Sans',sans-serif; transition:all .15s; white-space:nowrap; }
.tab:hover { color:var(--brown); }
.tab.active { color:var(--orange); border-bottom-color:var(--orange); }
.tab .count { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:18px; padding:0 5px; border-radius:10px; font-size:11px; font-weight:500; margin-left:6px; }
.tab.active .count { background:var(--orange); color:white; }
.tab:not(.active) .count { background:var(--warm); color:var(--grey); }

/* FILTRES */
.filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
.filter-input { border:1.5px solid var(--warm); border-radius:8px; padding:8px 12px; font-size:13px; font-family:'DM Sans',sans-serif; background:var(--white); color:var(--brown); outline:none; }
.filter-input:focus { border-color:var(--orange); }
.filter-input.large { flex:1; min-width:200px; }
.filter-input.date { width:140px; }
.btn-reset { background:var(--warm); color:var(--grey); border:none; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; }

/* STATS */
.stats { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.stat { background:var(--white); border-radius:10px; padding:10px 18px; box-shadow:0 1px 6px rgba(61,43,31,0.07); }
.stat-num { font-size:22px; font-weight:500; }
.stat-lbl { font-size:12px; color:var(--grey); }
.stat-total .stat-num { color:var(--brown); }
.stat-pas .stat-num { color:var(--amber); }
.stat-retard .stat-num { color:var(--red); }
.stat-rendu .stat-num { color:var(--green); }

/* TABLEAU */
.table-wrap { background:var(--white); border-radius:12px; box-shadow:var(--shadow); overflow-x:auto; }
table { width:100%; min-width:980px; border-collapse:collapse; }
thead tr { background:var(--warm); }
th { padding:10px 12px; text-align:left; font-size:12px; font-weight:500; color:var(--grey); letter-spacing:.03em; white-space:nowrap; }
td { padding:10px 12px; border-bottom:1px solid #f0ebe3; font-size:13px; vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:#fdf9f5; }
tr.rendu-row td { opacity:.8; }
.mat-nom { font-weight:500; font-size:14px; }
.sous { font-size:11px; color:var(--grey); margin-top:2px; }

/* STATUTS */
.st { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500; padding:4px 10px; border-radius:8px; white-space:nowrap; }
.st-rendu  { color:var(--green); background:var(--green-light); }
.st-pas    { color:var(--amber); background:var(--amber-light); }
.st-retard { color:var(--red);   background:var(--red-light); }
.st-orphan { color:var(--blue);  background:var(--blue-light); }

.lien-pdf { display:inline-block; font-size:12px; color:var(--orange); text-decoration:none; margin-right:8px; }
.lien-pdf:hover { text-decoration:underline; }

.print-bar { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center; }
.btn-print { background:var(--brown); color:white; border:none; border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; }
.btn-print:hover { background:#5a3e2e; }

.loading { text-align:center; padding:40px; color:var(--grey); font-size:14px; }
.empty { text-align:center; padding:40px; color:var(--grey); font-size:14px; font-style:italic; }
.erreur { text-align:center; padding:40px; color:var(--red); font-size:14px; }

.print-title { display:none; font-family:'Playfair Display',serif; font-size:16px; margin-bottom:12px; }
@media print {
    #entete, .entete-site, .tabs, .filters, .stats, .print-bar { display:none !important; }
    .table-wrap { box-shadow:none; }
    body { background:white; }
    .print-title { display:block !important; }
    td, th { padding:6px 8px; font-size:11px; }
    table { min-width:0; }
}
</style>
</head>
<body>
<div id="login-screen" style="position:fixed;inset:0;background:var(--cream);z-index:99999;display:flex;align-items:center;justify-content:center;">
  <div style="max-width:340px;width:90%;background:#fff;border:1px solid var(--warm);border-radius:10px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,0.08);">
    <h1 style="font-size:16px;margin:0 0 4px;">L'Arche de Mallo</h1>
    <p style="font-size:12px;color:var(--grey);margin-bottom:16px;">Connexion requise.</p>
    <input type="email" id="login-email" placeholder="Email" style="width:100%;box-sizing:border-box;margin-bottom:10px;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;">
    <input type="password" id="login-password" placeholder="Mot de passe" style="width:100%;box-sizing:border-box;margin-bottom:10px;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;">
    <div id="login-err"></div>
    <button type="button" onclick="seConnecterSuivi()" style="width:100%;padding:9px;background:var(--orange);color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:13px;">Se connecter</button>
  </div>
</div>

<div style="max-width:1200px;margin:0 auto;padding:0 20px;">
    <div id="entete"></div>
</div>

<div class="main">
    <!-- ONGLETS -->
    <div class="tabs">
        <button class="tab active" onclick="changerOnglet('pas-rendu')" id="tab-pas-rendu">
            Pas encore rendu <span class="count" id="cnt-pas-rendu">0</span>
        </button>
        <button class="tab" onclick="changerOnglet('rendu')" id="tab-rendu">
            Rendu <span class="count" id="cnt-rendu">0</span>
        </button>
        <button class="tab" onclick="changerOnglet('tous')" id="tab-tous">
            Tous les prêts <span class="count" id="cnt-tous">0</span>
        </button>
        <button class="tab" onclick="changerOnglet('orphelins')" id="tab-orphelins" title="Retours enregistrés pour lesquels aucun prêt correspondant n'a été trouvé">
            Retours sans prêt <span class="count" id="cnt-orphelins">0</span>
        </button>
    </div>

    <!-- FILTRES -->
    <div class="filters">
        <input type="text" class="filter-input large" id="f-search" placeholder="🔍  Emprunteur, matériel, n° de cage..." oninput="filtrer()">
        <input type="date" class="filter-input date" id="f-from" onchange="filtrer()" title="Prêt du...">
        <input type="date" class="filter-input date" id="f-to" onchange="filtrer()" title="Prêt au...">
        <button class="btn-reset" onclick="resetFiltres()">Réinitialiser</button>
    </div>

    <!-- STATS -->
    <div class="stats">
        <div class="stat stat-total"><div class="stat-num" id="stat-total">—</div><div class="stat-lbl">Prêts enregistrés</div></div>
        <div class="stat stat-pas"><div class="stat-num" id="stat-pas">—</div><div class="stat-lbl">Pas encore rendus</div></div>
        <div class="stat stat-retard"><div class="stat-num" id="stat-retard">—</div><div class="stat-lbl">dont en retard</div></div>
        <div class="stat stat-rendu"><div class="stat-num" id="stat-rendu">—</div><div class="stat-lbl">Rendus</div></div>
    </div>

    <!-- TABLEAU -->
    <div class="print-title" id="print-title">Suivi prêt matériel — L'Arche de Mallo</div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Matériel</th>
                    <th>Emprunteur</th>
                    <th>Date du prêt</th>
                    <th>Retour prévu</th>
                    <th>Statut</th>
                    <th>Date du retour</th>
                    <th>Constat de retour</th>
                    <th>Documents</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="8" class="loading">Chargement des données...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="print-bar">
        <button class="btn-print" onclick="window.print()">🖨️ Imprimer la liste affichée</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script src="supabase-config.js"></script>
<script src="config.js"></script>
<script src="formulaires-arche-mallo.js"></script>
<script>
// ============================================================
// CONNEXION — comme les autres pages Suivi (voir suivi_icad.html)
// ============================================================
const supabaseClient = creerClientSupabase();
initSessionSuivi();

// ============================================================
// ÉTAT
// Source : table materiel_mouvements (1 ligne par prêt OU par retour).
// Il n'existe pas de lien direct prêt → retour en base : on associe
// chaque retour au prêt correspondant (voir associerPretsRetours()).
// ============================================================
let lignesPrets   = [];   // un élément par prêt, avec son retour associé (ou null)
let retoursOrph   = [];   // retours sans prêt trouvé
let lignesFiltres = [];
let ongletActif   = 'pas-rendu';

// ------------------------------------------------------------
// Utilitaires
// ------------------------------------------------------------
function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(str) {
    if (!str) return '—';
    const p = String(str).slice(0, 10).split('-');
    if (p.length !== 3) return str;
    return p[2] + '/' + p[1] + '/' + p[0];
}
function aujourdhuiISO() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const j = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + j;
}
function joursEntre(isoDebut, isoFin) {
    const a = new Date(isoDebut + 'T00:00:00'), b = new Date(isoFin + 'T00:00:00');
    return Math.round((b - a) / 86400000);
}
function norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
}

// ------------------------------------------------------------
// Lecture du texte "materiel" écrit par creer_pret_materiel() /
// creer_retour_materiel() : segments séparés par " | ".
//   prêt   : <matériel> | Cage n°X | Caution 50€ | Retour prévu le AAAA-MM-JJ
//   retour : <matériel> | Cage n°X | État : … | Anomalies : … | Caution : …
//            | Conservé …€ | Restitué …€ | Mode : …
// ------------------------------------------------------------
function analyserTexte(texte) {
    const segs = String(texte || '').split(' | ').map(s => s.trim()).filter(Boolean);
    const r = { materiel: segs[0] || '', cage: '', caution: '', retourPrevu: '',
                etat: '', anomalies: '', statutCaution: '', conserve: '', restitue: '', mode: '' };
    segs.slice(1).forEach(s => {
        let m;
        if ((m = s.match(/^Cage n°\s*(.*)$/i)))        r.cage = m[1].trim();
        else if ((m = s.match(/^Retour prévu le\s*(\d{4}-\d{2}-\d{2})/i))) r.retourPrevu = m[1];
        else if ((m = s.match(/^État\s*:\s*(.*)$/i)))   r.etat = m[1].trim();
        else if ((m = s.match(/^Anomalies\s*:\s*(.*)$/i))) r.anomalies = m[1].trim();
        else if ((m = s.match(/^Caution\s*:\s*(.*)$/i))) r.statutCaution = m[1].trim();
        else if ((m = s.match(/^Caution\s+(.*)$/i)))     r.caution = m[1].trim();
        else if ((m = s.match(/^Conservé\s+(.*)$/i)))    r.conserve = m[1].trim();
        else if ((m = s.match(/^Restitué\s+(.*)$/i)))    r.restitue = m[1].trim();
        else if ((m = s.match(/^Mode\s*:\s*(.*)$/i)))    r.mode = m[1].trim();
    });
    return r;
}

// ------------------------------------------------------------
// Lecture par pages de 1000 (limite PostgREST)
// ------------------------------------------------------------
async function lireTout(construire) {
    const taille = 1000;
    let tout = [];
    for (let debut = 0; ; debut += taille) {
        const { data, error } = await construire().range(debut, debut + taille - 1);
        if (error) throw error;
        tout = tout.concat(data || []);
        if (!data || data.length < taille) break;
    }
    return tout;
}

// ------------------------------------------------------------
// Association prêt → retour
// Pour chaque personne, on parcourt ses prêts du plus ancien au plus
// récent et on leur associe le premier retour encore libre, daté du
// jour du prêt ou après, qui concerne le même matériel :
//   - même n° de cage si les deux en ont un,
//   - sinon même type de matériel.
// ------------------------------------------------------------
function memeMateriel(pret, retour) {
    if (pret.cage && retour.cage) return norm(pret.cage) === norm(retour.cage);
    return norm(pret.materiel) === norm(retour.materiel);
}

function associerPretsRetours(mouvements, fichiersParId) {
    const parPersonne = {};
    mouvements.forEach(m => {
        const cle = m.personne_id || ('sans-personne-' + m.id);
        (parPersonne[cle] = parPersonne[cle] || []).push(m);
    });

    const prets = [];
    const orphelins = [];

    Object.keys(parPersonne).forEach(cle => {
        const liste = parPersonne[cle].slice().sort((a, b) =>
            String(a.date_mouvement || '').localeCompare(String(b.date_mouvement || '')) ||
            String(a.id).localeCompare(String(b.id)));
        const pretsP   = liste.filter(m => m.type_mouvement === 'pret');
        const retoursP = liste.filter(m => m.type_mouvement === 'retour').map(m => ({ m, utilise: false, info: analyserTexte(m.materiel) }));

        pretsP.forEach(p => {
            const infoP = analyserTexte(p.materiel);
            const candidat = retoursP.find(r =>
                !r.utilise &&
                String(r.m.date_mouvement || '') >= String(p.date_mouvement || '') &&
                memeMateriel(infoP, r.info));
            if (candidat) candidat.utilise = true;
            const pers = p.personnes || {};
            prets.push({
                id: p.id,
                nom: pers.nom || '', prenom: pers.prenom || '', telephone: pers.telephone || '', email: pers.email || '',
                datePret: p.date_mouvement || '',
                pret: infoP,
                retour: candidat ? { date: candidat.m.date_mouvement || '', info: candidat.info, id: candidat.m.id } : null,
                pdfPret:   fichiersParId[p.id] || '',
                pdfRetour: candidat ? (fichiersParId[candidat.m.id] || '') : ''
            });
        });

        retoursP.filter(r => !r.utilise).forEach(r => {
            const pers = r.m.personnes || {};
            orphelins.push({
                id: r.m.id,
                nom: pers.nom || '', prenom: pers.prenom || '', telephone: pers.telephone || '', email: pers.email || '',
                dateRetour: r.m.date_mouvement || '',
                info: r.info,
                pdfRetour: fichiersParId[r.m.id] || ''
            });
        });
    });

    // Plus récents en premier
    prets.sort((a, b) => String(b.datePret).localeCompare(String(a.datePret)));
    orphelins.sort((a, b) => String(b.dateRetour).localeCompare(String(a.dateRetour)));
    return { prets, orphelins };
}

// Statut d'un prêt : 'rendu' | 'pas-rendu' | 'retard'
function statutDe(l) {
    if (l.retour) return 'rendu';
    if (l.pret.retourPrevu && l.pret.retourPrevu < aujourdhuiISO()) return 'retard';
    return 'pas-rendu';
}

// ------------------------------------------------------------
// Chargement
// ------------------------------------------------------------
async function chargerDonnees() {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="8" class="loading">Chargement des données...</td></tr>';
    try {
        const mouvements = await lireTout(() => supabaseClient
            .from('materiel_mouvements')
            .select('id, type_mouvement, materiel, date_mouvement, personne_id, personnes ( nom, prenom, telephone, email )')
            .order('date_mouvement', { ascending: true })
            .order('id'));

        // PDF déposés sur Drive (liens enregistrés à chaque prêt / retour)
        const fichiers = await lireTout(() => supabaseClient
            .from('soumission_fichiers')
            .select('enregistrement_id, url')
            .eq('table_source', 'materiel_mouvements')
            .order('id'));
        const fichiersParId = {};
        fichiers.forEach(f => { fichiersParId[f.enregistrement_id] = f.url; });

        const res = associerPretsRetours(mouvements, fichiersParId);
        lignesPrets = res.prets;
        retoursOrph = res.orphelins;
        filtrer();
    } catch (err) {
        console.error('[Suivi prêt matériel]', err);
        document.getElementById('tbody').innerHTML =
            '<tr><td colspan="8" class="erreur">Erreur de chargement : ' + esc(err.message || err) + '</td></tr>';
    }
}

// ------------------------------------------------------------
// Filtrage + rendu
// ------------------------------------------------------------
function texteRecherche(l) {
    return norm([l.nom, l.prenom, l.pret ? l.pret.materiel : l.info.materiel, l.pret ? l.pret.cage : l.info.cage].join(' '));
}

function filtrer() {
    const q    = norm(document.getElementById('f-search').value);
    const from = document.getElementById('f-from').value;
    const to   = document.getElementById('f-to').value;

    const passeFiltres = (l, dateRef) => {
        if (q && texteRecherche(l).indexOf(q) === -1) return false;
        if (from && String(dateRef || '').slice(0, 10) < from) return false;
        if (to   && String(dateRef || '').slice(0, 10) > to)   return false;
        return true;
    };

    const pretsFiltres = lignesPrets.filter(l => passeFiltres(l, l.datePret));
    const orphFiltres  = retoursOrph.filter(l => passeFiltres(l, l.dateRetour));

    // Compteurs d'onglets / stats sur les résultats filtrés
    const nbRendu  = pretsFiltres.filter(l => statutDe(l) === 'rendu').length;
    const nbRetard = pretsFiltres.filter(l => statutDe(l) === 'retard').length;
    const nbPas    = pretsFiltres.length - nbRendu;

    document.getElementById('cnt-pas-rendu').textContent = nbPas;
    document.getElementById('cnt-rendu').textContent     = nbRendu;
    document.getElementById('cnt-tous').textContent      = pretsFiltres.length;
    document.getElementById('cnt-orphelins').textContent = orphFiltres.length;
    document.getElementById('stat-total').textContent    = pretsFiltres.length;
    document.getElementById('stat-pas').textContent      = nbPas;
    document.getElementById('stat-retard').textContent   = nbRetard;
    document.getElementById('stat-rendu').textContent    = nbRendu;

    if (ongletActif === 'orphelins') {
        lignesFiltres = orphFiltres;
        rendreOrphelins();
    } else {
        lignesFiltres = pretsFiltres.filter(l => {
            const s = statutDe(l);
            if (ongletActif === 'rendu') return s === 'rendu';
            if (ongletActif === 'pas-rendu') return s !== 'rendu';
            return true;
        });
        rendreTableau();
    }
}

function badgeStatut(l) {
    const s = statutDe(l);
    if (s === 'rendu') return '<span class="st st-rendu">✓ Rendu</span>';
    if (s === 'retard') {
        const j = joursEntre(l.pret.retourPrevu, aujourdhuiISO());
        return '<span class="st st-retard">⚠ En retard de ' + j + ' j</span>';
    }
    return '<span class="st st-pas">⏳ Pas encore rendu</span>';
}

function liensPdf(l) {
    let h = '';
    if (l.pdfPret)   h += '<a class="lien-pdf" href="' + esc(l.pdfPret) + '" target="_blank" rel="noopener">📄 Prêt</a>';
    if (l.pdfRetour) h += '<a class="lien-pdf" href="' + esc(l.pdfRetour) + '" target="_blank" rel="noopener">📄 Retour</a>';
    return h || '<span class="sous">—</span>';
}

function constatRetour(info) {
    const parts = [];
    if (info.etat) parts.push('État : ' + esc(info.etat));
    if (info.anomalies) parts.push('Anomalies : ' + esc(info.anomalies));
    let caution = '';
    if (info.statutCaution) caution = 'Caution : ' + esc(info.statutCaution);
    if (info.conserve) caution += (caution ? ' · ' : '') + 'conservé ' + esc(info.conserve);
    if (info.restitue) caution += (caution ? ' · ' : '') + 'restitué ' + esc(info.restitue);
    if (caution) parts.push(caution);
    return parts.length ? parts.join('<div class="sous"></div>') : '<span class="sous">—</span>';
}

function cellEmprunteur(l) {
    const nom = esc((l.nom + ' ' + l.prenom).trim() || '—');
    const contact = [l.telephone, l.email].filter(Boolean).map(esc).join(' · ');
    return '<div class="mat-nom">' + nom + '</div>' + (contact ? '<div class="sous">' + contact + '</div>' : '');
}

function rendreTableau() {
    const tbody = document.getElementById('tbody');
    if (!lignesFiltres.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">Aucun prêt à afficher.</td></tr>';
        return;
    }
    tbody.innerHTML = lignesFiltres.map(l => {
        const caution = l.pret.caution ? '<div class="sous">Caution ' + esc(l.pret.caution) + '</div>' : '';
        const cage    = l.pret.cage ? '<div class="sous">Cage n°' + esc(l.pret.cage) + '</div>' : '';
        return '<tr class="' + (l.retour ? 'rendu-row' : '') + '">' +
            '<td><div class="mat-nom">' + esc(l.pret.materiel || '—') + '</div>' + cage + caution + '</td>' +
            '<td>' + cellEmprunteur(l) + '</td>' +
            '<td>' + fmtDate(l.datePret) + '</td>' +
            '<td>' + fmtDate(l.pret.retourPrevu) + '</td>' +
            '<td>' + badgeStatut(l) + '</td>' +
            '<td>' + (l.retour ? fmtDate(l.retour.date) : '<span class="sous">—</span>') + '</td>' +
            '<td>' + (l.retour ? constatRetour(l.retour.info) : '<span class="sous">—</span>') + '</td>' +
            '<td>' + liensPdf(l) + '</td>' +
            '</tr>';
    }).join('');
}

function rendreOrphelins() {
    const tbody = document.getElementById('tbody');
    if (!lignesFiltres.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty">Aucun retour sans prêt.</td></tr>';
        return;
    }
    tbody.innerHTML = lignesFiltres.map(l => {
        const cage = l.info.cage ? '<div class="sous">Cage n°' + esc(l.info.cage) + '</div>' : '';
        return '<tr>' +
            '<td><div class="mat-nom">' + esc(l.info.materiel || '—') + '</div>' + cage + '</td>' +
            '<td>' + cellEmprunteur(l) + '</td>' +
            '<td><span class="sous">—</span></td>' +
            '<td><span class="sous">—</span></td>' +
            '<td><span class="st st-orphan">Retour sans prêt trouvé</span></td>' +
            '<td>' + fmtDate(l.dateRetour) + '</td>' +
            '<td>' + constatRetour(l.info) + '</td>' +
            '<td>' + liensPdf({ pdfRetour: l.pdfRetour }) + '</td>' +
            '</tr>';
    }).join('');
}

function changerOnglet(onglet) {
    ongletActif = onglet;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + onglet).classList.add('active');
    filtrer();
}

function resetFiltres() {
    document.getElementById('f-search').value = '';
    document.getElementById('f-from').value   = '';
    document.getElementById('f-to').value     = '';
    filtrer();
}
